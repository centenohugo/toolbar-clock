<!doctype html>
<!-- Dev only: the popup with a stubbed chrome API. Serve the repo root over
     http (npx --yes http-server) and open /dev/popup-preview.html. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Popup preview</title>
    <link rel="stylesheet" href="../src/popup/popup.css" />
    <style>
      html {
        min-height: 100%;
        background: #8a8a8e;
      }
      body {
        margin: 32px auto;
        outline: 1px solid rgb(0 0 0 / 0.2);
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      import { installChromeStub } from './chrome-stub.js';

      await installChromeStub({
        locale: 'es',
        settings: {
          version: 1,
          zones: [
            { id: 'local', timeZone: null, label: '' },
            { id: 'ny', timeZone: 'America/New_York', label: '' },
            { id: 'tokyo', timeZone: 'Asia/Tokyo', label: '' },
            { id: 'kolkata', timeZone: 'Asia/Kolkata', label: '' },
          ],
          primaryId: 'local',
        },
      });
      await import('../src/popup/popup.js');
    </script>
  </body>
</html>
